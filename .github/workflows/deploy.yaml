name: Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run tests
      run: pytest

  build:
    needs: test
    runs-on: windows-latest # Cambiato in windows-latest per generare l'exe Windows (opzionale)
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Build application with PyInstaller
      run: |
        pyinstaller Palestra3000.spec
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Palestra3000-executable
        path: dist/